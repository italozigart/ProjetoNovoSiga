spring.application.name=novosiga

# ==========================================================
# BANCO DE DADOS (PostgreSQL)
# O valor depois dos ":" é o padrão usado em sala. Se o seu
# PostgreSQL usa outra senha/porta, altere aqui ou defina as
# variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_novosiga_v2}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
# Atualiza o banco de dados automaticamente (cria tabelas e colunas novas)
spring.jpa.hibernate.ddl-auto=update

# Exibir no terminal o SQL sendo executado
spring.jpa.show-sql=true

# Mantém a sessão do banco aberta até a página ser montada
# (as telas de pedidos listam os itens de cada pedido)
spring.jpa.open-in-view=true

# A validação dos formulários é feita nos controllers (@Valid).
# Desligamos a revalidação automática do Hibernate para que registros
# antigos (cadastrados antes das validações) continuem podendo ser
# atualizados, por exemplo na baixa de estoque de um produto antigo.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# ==========================================================
# THYMELEAF
# ==========================================================
# Limpar o cache para a execução do Thymeleaf
spring.thymeleaf.cache=false

# ==========================================================
# UPLOAD DE IMAGENS
# ==========================================================
# Limitar tamanho máximo do arquivo para 2mb
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ==========================================================
# DADOS DE EXEMPLO
# true  = na primeira execução (tabelas vazias) cria cursos, professores,
#         disciplinas, alunos, atléticas, produtos e o usuário admin/admin123
# false = não cria nada
# ==========================================================
novosiga.dados-exemplo=true
