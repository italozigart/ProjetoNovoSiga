<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cadastro de usuário')}">
    <title>Cadastro de Usuários</title>
</head>

<body>

<main class="auth-page">

    <div class="auth-card largo">

        <div class="auth-logo"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Cadastro de Usuários</h1>
        <p class="sub">Crie seu acesso ao Novo Siga</p>

        <form th:action="@{/usuarios/salvar}" action="#" method="post" th:object="${usuario}">

            <div class="form-grid">

                <div class="form-group full">
                    <label for="nomeUsuario">Nome <span class="required">*</span></label>
                    <input type="text" th:field="*{nomeUsuario}" th:errorclass="is-invalid"
                           maxlength="40" placeholder="Seu nome" required>
                    <span class="field-error" th:if="${#fields.hasErrors('nomeUsuario')}" th:errors="*{nomeUsuario}">Erro</span>
                </div>

                <div class="form-group">
                    <label for="cpfUsuario">CPF <span class="required">*</span></label>
                    <input type="text" th:field="*{cpfUsuario}" th:errorclass="is-invalid"
                           data-mascara="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
                    <span class="field-error" th:if="${#fields.hasErrors('cpfUsuario')}" th:errors="*{cpfUsuario}">Erro</span>
                </div>

                <div class="form-group">
                    <label for="loginUsuario">Login <span class="required">*</span></label>
                    <input type="text" th:field="*{loginUsuario}" th:errorclass="is-invalid"
                           maxlength="30" placeholder="Ex.: italo" autocomplete="username" required>
                    <span class="field-error" th:if="${#fields.hasErrors('loginUsuario')}" th:errors="*{loginUsuario}">Erro</span>
                </div>

                <div class="form-group full">
                    <label for="senhaUsuario">Senha <span class="required">*</span></label>
                    <input type="password" th:field="*{senhaUsuario}" th:errorclass="is-invalid"
                           placeholder="Mínimo de 4 caracteres" autocomplete="new-password" required>
                    <span class="field-error" th:if="${#fields.hasErrors('senhaUsuario')}" th:errors="*{senhaUsuario}">Erro</span>
                </div>

            </div>

            <div class="form-actions">
                <a th:href="@{/login}" href="#" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
            </div>

        </form>

    </div>

</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
