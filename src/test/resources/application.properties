# Configuração usada SOMENTE pelos testes automatizados (mvnw test).
# Usa o banco H2 em memória, então os testes rodam sem PostgreSQL.
spring.datasource.url=jdbc:h2:mem:novosiga_teste;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.thymeleaf.cache=false
novosiga.dados-exemplo=false
